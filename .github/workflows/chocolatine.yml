name: The best workflow

on:
  push:
    branches-ignore:
      - 'ga-ignore-*'
  pull_request:
    branches-ignore:
      - 'ga-ignore-*'

env:
  MIRROR_URL: EpitechPGEPromo2029/B-DOP-200-TLS-2-1-chocolatine-pavel.de-wavrechin
  EXECUTABLES: mysh

jobs:

  coding_style:

    if: ${{ github.repository != vars.MIRROR_REPO }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/epitech/coding-style-checker:latest

    steps:
      - name: check_coding_style
        uses: actions/checkout@v4
      
      - name: run_coding_style
        run: check.sh $(pwd) $(pwd) ; ls

      - name: display_coding_style
        run: cat coding-style-reports.log
